delivo:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${DELIVO_DATASOURCE_HOST:localhost}
    port: 3306
    database: delivo
    username: ${DELIVO_DATASOURCE_USERNAME:root}
    password: ${DELIVO_DATASOURCE_PASSWORD:}
  alioss:
    endpoint: ${DELIVO_ALIOSS_ENDPOINT:}
    access-key-id: ${DELIVO_ALIOSS_ACCESS_KEY_ID:}
    access-key-secret: ${DELIVO_ALIOSS_ACCESS_KEY_SECRET:}
    bucket-name: ${DELIVO_ALIOSS_BUCKET_NAME:}
  redis:
    host: ${DELIVO_REDIS_HOST:localhost}
    port: 6379
    password: ${DELIVO_REDIS_PASSWORD:}
    database: 10
  wechat:
    appid: ${DELIVO_WECHAT_APPID:}
    secret: ${DELIVO_WECHAT_SECRET:}
    mchid: ${DELIVO_WECHAT_MCHID:}
    mchSerialNo: ${DELIVO_WECHAT_MCH_SERIAL_NO:}
    privateKeyFilePath: ${DELIVO_WECHAT_PRIVATE_KEY_FILE_PATH:}
    apiV3Key: ${DELIVO_WECHAT_API_V3_KEY:}
    weChatPayCertFilePath: ${DELIVO_WECHAT_PAY_CERT_FILE_PATH:}
    notifyUrl: ${DELIVO_WECHAT_NOTIFY_URL:}
    refundNotifyUrl: ${DELIVO_WECHAT_REFUND_NOTIFY_URL:}
